name: Pipeline Watch CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check application syntax
        run: npm run check

  test:
    name: Test application
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run automated tests
        run: npm test

  package:
    name: Package application
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Create application package
        run: npm run package

      - name: Save application package
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-watch-${{ github.sha }}
          path: pipeline-watch-*.tgz
          if-no-files-found: error
          retention-days: 3